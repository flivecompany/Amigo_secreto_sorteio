name: Publicar Worker (aflive.com.br)

on:
  push:
    branches: ["claude/bold-euler-054380"] # [FLIVE IA] só a branch padrão publica
    paths:
      - "docs/**"
      - "cloudflare/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes do sorteio (JS)
        run: node --test tests/sorteio.test.mjs

      - name: Testes do sorteio (Python)
        run: python3 -m unittest -v

      - name: Verificar segredos
        id: segredos
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REF: ${{ github.ref_name }}
          PADRAO: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$PADRAO" ]; then
            echo "::warning::[FLIVE IA] Branch $REF não é a padrão ($PADRAO). Deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::warning::[FLIVE IA] Segredo CLOUDFLARE_API_TOKEN ausente. Deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy no Cloudflare
        if: steps.segredos.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Teste de fumaça
        if: steps.segredos.outputs.ok == 'true'
        run: |
          url=https://aflive.com.br/Amigo_secreto_sorteio/
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::[FLIVE IA] $url não respondeu 200"
          exit 1
